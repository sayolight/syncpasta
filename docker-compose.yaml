services:
  server:
    container_name: syncpasta-server
    image: ghcr.io/sayolight/syncpasta-server:latest
    env_file:
      - .env
    depends_on:
      - db

  client:
    container_name: syncpasta-client
    image: ghcr.io/sayolight/syncpasta-client:latest
    depends_on:
      - server

  db:
    container_name: syncpasta-db
    image: postgres:17.6
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  s3:
    container_name: syncpasta-s3
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - "minio_data:/data"
    command: server /data --console-address ":9001"

  nginx:
    container_name: syncpasta-nginx
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
      - s3

volumes:
  db_data:
  minio_data:
